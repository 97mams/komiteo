[package]
name = "komiteo"
version = "1.0.0"
edition = "2024"

[dependencies]
colored = "3.0.0"
boxy-cli = "2.0.0"
cfonts = "1.3.0"
dirs = "6.0.0"
futures-util = "0.3.32"
openrouter-rs = "0.8.0"
tokio = { version = "1", features = ["full"] }
crossterm = "0.27"
spinners = "4.2.0"
indicatif = "0.18.4"
fancy_print = "0.1.0"
rustyline = "18.0.0"
notify = "8.2.0"
clap = { version = "4.6.1", features = ["derive"] }
inquire = "0.9.4"

[[bin]]
edition = "2024"
name = "komiteo"
path = "src/main.rs"